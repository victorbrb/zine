<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zine Prototype</title>
<style>
  @import url('https://fonts.googleapis.com/css?family=Cormorant+Garamond:400,600&display=swap');

  :root {
    --page-bg: #F5F5F5;
    --dark-text: #2A2935;
    --baseline: 12px;
    --title-font: 'Cormorant Garamond', serif;
  }

  * { box-sizing: border-box; }

  html {
    overflow-x: hidden;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111111;
    font-family: var(--title-font);
    gap: 20px;
    padding: 20px;
    overflow-x: hidden;
  }

  .cover {
    aspect-ratio: 2 / 1.3;
    width: min(85vw, calc(90vh * (2 / 1.3)));
    height: auto;
    max-height: 90vh;
    box-shadow: 0 0 60px rgba(0,0,0,.25);
    position: relative;
    overflow: hidden;
  }

  .cover.single {
    aspect-ratio: 1 / 1.3;
    width: min(42.5vw, calc(90vh * (1 / 1.3)));
  }

  .single-page {
    position: absolute;
    inset: 0;
    background: var(--page-bg);
    transition: opacity 0.35s ease;
    opacity: 1;
  }

  .book {
    position: absolute;
    inset: 0;
    display: flex;
    perspective: 1600px;
    transition: opacity 0.35s ease;
    opacity: 1;
  }

  .single-page.hidden,
  .book.hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* static base pages: always present underneath everything */
  .base-page {
    width: 50%;
    height: 100%;
    background: var(--page-bg);
    position: relative;
    z-index: 0;
  }
  .base-page.right { position: absolute; right: 0; top: 0; }

  /* each leaf is a full sheet: front (currently facing right) and
     back (revealed once flipped) — both pre-rendered, nothing swaps at runtime */
  .leaf {
    position: absolute;
    top: 0;
    right: 0;
    width: 50%;
    height: 100%;
    transform-style: preserve-3d;
    transform-origin: 0% 0%;
    transform: rotateY(0deg);
    transition: transform 0.7s ease-in-out;
    will-change: transform;
  }

  .leaf.flipped {
    transform: rotateY(-180deg);
  }

  .face {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    backface-visibility: hidden;
    background: var(--page-bg);
  }

  .face.front {
    transform: rotateY(0deg) translateZ(1px);
    background-image: linear-gradient(90deg, rgba(0,0,0,0.08) 0%, rgba(0,0,0,0) 12%);
  }

  .face.back {
    transform: rotateY(180deg) translateZ(1px);
    background-image: linear-gradient(-90deg, rgba(0,0,0,0.08) 0%, rgba(0,0,0,0) 12%);
  }

  .media-real {
    position: absolute;
    inset: 0;
    background: var(--page-bg);
  }

  .media-fill {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .media-placeholder {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      45deg,
      #e8e8e3,
      #e8e8e3 10px,
      #deded8 10px,
      #deded8 20px
    );
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: #7a7a72;
    text-align: center;
  }

  .media-placeholder .media-icon {
    font-size: 26px;
    line-height: 1;
  }

  .media-placeholder .media-type {
    font-size: 13px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .media-placeholder .media-badge {
    font-size: 11px;
    color: #9a9a90;
    letter-spacing: 0.3px;
  }

  .media-placeholder .media-label {
    font-size: 12px;
    color: #999;
    margin-top: 2px;
  }

  .page-number {
    position: absolute;
    bottom: 10px;
    right: 10px;
    font-size: 12px;
    color: #8a8a82;
    background: rgba(255,255,255,0.6);
    padding: 2px 8px;
    border-radius: 3px;
  }
  .face.back .page-number { left: 10px; right: auto; }
  .base-page.left .page-number { left: 10px; right: auto; }

  .base-page .page-inner {
    height: 100%;
  }

  .layout {
    display: flex;
    align-items: center;
    gap: 28px;
  }

  .nav-btn {
    flex-shrink: 0;
    padding: 0;
    border: none;
    background: none;
    cursor: pointer;
    display: flex;
    line-height: 0;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .nav-btn img { width: 56px; height: 56px; display: block; }
  .nav-btn:hover:not(:disabled) { transform: scale(1.06); }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }
</style>
</head>
<body>

<div class="layout">
  <button id="prevBtn" class="nav-btn"><img src="assets/previous.svg" alt="Previous"></button>

  <div class="cover" id="coverEl">
    <div class="single-page" id="singlePage"></div>
    <div class="book" id="book"></div>
  </div>

  <button id="nextBtn" class="nav-btn"><img src="assets/next.svg" alt="Next"></button>
</div>

<script>
  // Each entry = one physical page face. `media` is 'image' or 'video' —
  // swap the placeholder for a real <img>/<video src="..."> later.
  const pages = [
    { label: "Cover", media: "image", src: "vol/1/cover.png" },
    { label: "Contents", media: "image" src: "vol/1/cover.png" },
    { label: "Intro", media: "image" src: "vol/1/cover.png" },
    { label: "Feature Article", media: "video" src: "vol/1/cover.png" },
    { label: "Interview", media: "image" src: "vol/1/cover.png" },
    { label: "Gallery", media: "video" src: "vol/1/cover.png" },
    { label: "Notes", media: "image" src: "vol/1/cover.png" },
    { label: "Reviews", media: "image" src: "vol/1/cover.png" },
    { label: "Contributors", media: "image" src: "vol/1/cover.png" },
    { label: "Back Cover", media: "image" src: "vol/1/cover.png" }
  ];

  const coverPage = pages[0];
  const backCoverPage = pages[pages.length - 1];
  const contentPages = pages.slice(1, pages.length - 1); // interior pages only

  const totalSpreads = contentPages.length / 2;
  const totalLeaves = totalSpreads - 1; // number of flippable sheets

  const coverEl = document.getElementById('coverEl');
  const singlePageEl = document.getElementById('singlePage');
  const bookEl = document.getElementById('book');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  function mediaPlaceholderHTML(page, pageNum) {
    const isVideo = page.media === 'video';
    const icon = isVideo ? '&#9654;' : '&#128247;';
    const type = isVideo ? 'MP4' : 'PNG';
    const badge = isVideo ? 'autoplay · loop' : 'static image';
    return `
      <div class="media-placeholder">
        <div class="media-icon">${icon}</div>
        <div class="media-type">${type} placeholder</div>
        <div class="media-badge">${badge}</div>
        <div class="media-label">${page.label}</div>
        <div class="page-number">${pageNum}</div>
      </div>
    `;
  }

  function mediaRealHTML(page, pageNum) {
    const isVideo = page.media === 'video';
    const mediaTag = isVideo
      ? `<video class="media-fill" src="${page.src}" autoplay loop muted playsinline></video>`
      : `<img class="media-fill" src="${page.src}" alt="${page.label}">`;
    return `
      <div class="media-real">
        ${mediaTag}
        <div class="page-number">${pageNum}</div>
      </div>
    `;
  }

  function pageContentHTML(page, pageNum) {
    if (!page) return '';
    return page.src ? mediaRealHTML(page, pageNum) : mediaPlaceholderHTML(page, pageNum);
  }

  // --- Build the DOM once: static base pages + all leaves, nothing re-renders on flip ---
  const staticLeft = document.createElement('div');
  staticLeft.className = 'base-page left';
  staticLeft.innerHTML = `<div class="page-inner">${pageContentHTML(contentPages[0], 2)}</div>`;

  const staticRight = document.createElement('div');
  staticRight.className = 'base-page right';
  staticRight.innerHTML = `<div class="page-inner">${pageContentHTML(contentPages[contentPages.length - 1], pages.length - 1)}</div>`;

  bookEl.appendChild(staticLeft);
  bookEl.appendChild(staticRight);

  const leafEls = [];
  for (let i = 0; i < totalLeaves; i++) {
    const frontPage = contentPages[2 * i + 1];
    const backPage = contentPages[2 * i + 2];
    const frontNum = 2 * i + 3;
    const backNum = 2 * i + 4;

    const leaf = document.createElement('div');
    leaf.className = 'leaf';
    leaf.style.zIndex = totalLeaves - i; // leaf 0 starts on top of the right-hand stack
    leaf.innerHTML = `
      <div class="face front">${pageContentHTML(frontPage, frontNum)}</div>
      <div class="face back">${pageContentHTML(backPage, backNum)}</div>
    `;
    bookEl.appendChild(leaf);
    leafEls.push(leaf);
  }

  let mode = 'front'; // 'front' | 'open' | 'back'
  let k = 0; // number of interior leaves currently flipped = current interior spread index
  let zCounter = totalLeaves + 1;
  let animating = false;

  function renderSinglePage(mode) {
    const page = mode === 'front' ? coverPage : backCoverPage;
    const pageNum = mode === 'front' ? 1 : pages.length;
    singlePageEl.innerHTML = pageContentHTML(page, pageNum);
  }

  function applyMode() {
    if (mode === 'open') {
      coverEl.classList.remove('single');
      singlePageEl.classList.add('hidden');
      bookEl.classList.remove('hidden');
    } else {
      coverEl.classList.add('single');
      bookEl.classList.add('hidden');
      singlePageEl.classList.remove('hidden');
      renderSinglePage(mode);
    }
  }

  // Crossfades from the currently visible layer (single-page or book) to the
  // other one, swapping mode/content only while fully faded out so nothing pops.
  function transitionToCover(newMode, newK) {
    animating = true;
    const outgoing = mode === 'open' ? bookEl : singlePageEl;
    outgoing.classList.add('hidden');

    setTimeout(() => {
      mode = newMode;
      if (newK !== undefined) k = newK;

      if (mode === 'open') {
        coverEl.classList.remove('single');
        singlePageEl.classList.add('hidden');
      } else {
        coverEl.classList.add('single');
        bookEl.classList.add('hidden');
        renderSinglePage(mode);
      }

      const incoming = mode === 'open' ? bookEl : singlePageEl;
      void incoming.offsetWidth; // force reflow so the fade-in actually transitions
      incoming.classList.remove('hidden');

      updateControls();
      setTimeout(() => { animating = false; updateControls(); }, 350);
    }, 350);
  }

  function updateControls() {
    prevBtn.disabled = mode === 'front' || animating;
    nextBtn.disabled = mode === 'back' || animating;
  }

  
  function goNext() {
    if (animating) return;

    if (mode === 'front') {
      transitionToCover('open', 0);
      return;
    }

    if (mode === 'open') {
      if (k < totalLeaves) {
        animating = true;
        const leaf = leafEls[k];
        leaf.style.zIndex = ++zCounter;
        leaf.classList.add('flipped');
        k++;
        updateControls();
        setTimeout(() => { animating = false; updateControls(); }, 700);
      } else {
        transitionToCover('back');
      }
      return;
    }
    // mode === 'back': nothing further
  }

  function goPrev() {
    if (animating) return;

    if (mode === 'back') {
      transitionToCover('open', totalLeaves);
      return;
    }

    if (mode === 'open') {
      if (k > 0) {
        animating = true;
        k--;
        const leaf = leafEls[k];
        leaf.style.zIndex = ++zCounter;
        leaf.classList.remove('flipped');
        updateControls();
        setTimeout(() => { animating = false; updateControls(); }, 700);
      } else {
        transitionToCover('front');
      }
      return;
    }
    // mode === 'front': nothing further
  }

  prevBtn.addEventListener('click', goPrev);
  nextBtn.addEventListener('click', goNext);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') goPrev();
    if (e.key === 'ArrowRight') goNext();
  });

  let touchStartX = null;
  coverEl.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; });
  coverEl.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 50) { dx < 0 ? goNext() : goPrev(); }
    touchStartX = null;
  });

  applyMode();
  updateControls();
</script>

</body>
</html>
